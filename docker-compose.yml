# Full stack: web (Next.js), ml (FastAPI win prediction) and db (Postgres).
#
#   cp .env.example .env
#   docker compose up --build      # http://localhost:3000

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Called from the browser, so it must be reachable from the host.
        NEXT_PUBLIC_ML_API_URL: ${ML_API_URL-http://localhost:8000}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://pokedex:pokedex@db:5432/pokedex}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ml:
    build: ./ml
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${ML_PORT:-8000}:8000"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Host access for `npm run dev` (see web/.env.example); local only.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
